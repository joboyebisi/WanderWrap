AWSTemplateFormatVersion: '2010-09-09'
Description: WanderWrap serverless application

Parameters:
  ProjectName:
    Type: String
    Default: wanderwrap
    AllowedPattern: '[a-z0-9-]+'
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, staging, production]
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  WebUrl:
    Type: String
    Default: https://www.wanderwrap.co.uk
  WebCallbackUrls:
    Type: String
    Default: https://www.wanderwrap.co.uk/api/auth/callback
    Description: Comma-separated exact Cognito callback URLs for every approved web origin.
  WebLogoutUrls:
    Type: String
    Default: https://www.wanderwrap.co.uk
    Description: Comma-separated exact post-logout URLs for every approved web origin.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://www.wanderwrap.co.uk,https://wanderwrap.co.uk
  AlexaRedirectUris:
    Type: String
    Default: ''
    Description: Comma-separated exact redirect URIs supplied by Alexa+ onboarding. Leave empty until onboarding.
  ApiDomainName:
    Type: String
    Default: ''
  ApiCertificateArn:
    Type: String
    Default: ''
  AuthDomainName:
    Type: String
    Default: ''
    Description: Optional Cognito custom domain such as auth.wanderwrap.co.uk.
  AuthCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for the auth custom domain, issued in us-east-1.
  AuthPrefixDomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|[a-z0-9-]+'
    Description: Optional Cognito-owned fallback domain prefix. May coexist with the custom auth domain.
  GoogleClientId:
    Type: String
    Default: ''
    Description: Optional Google OAuth web client ID used only for Cognito identity federation.
  GoogleClientSecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN whose JSON contains the Google OAuth client_secret key.

Conditions:
  HasAlexaRedirect: !Not [!Equals [!Ref AlexaRedirectUris, '']]
  HasCustomApiDomain: !And
    - !Not [!Equals [!Ref ApiDomainName, '']]
    - !Not [!Equals [!Ref ApiCertificateArn, '']]
  HasCustomAuthDomain: !And
    - !Not [!Equals [!Ref AuthDomainName, '']]
    - !Not [!Equals [!Ref AuthCertificateArn, '']]
  HasExplicitPrefixAuthDomain: !Not [!Equals [!Ref AuthPrefixDomainName, '']]
  HasPrefixAuthDomain: !Or
    - !Not [!Equals [!Ref AuthPrefixDomainName, '']]
    - !Not
      - !And
        - !Not [!Equals [!Ref AuthDomainName, '']]
        - !Not [!Equals [!Ref AuthCertificateArn, '']]
  HasGoogleIdentityProvider: !And
    - !Not [!Equals [!Ref GoogleClientId, '']]
    - !Not [!Equals [!Ref GoogleClientSecretArn, '']]

Resources:
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectName}-${Environment}-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: WanderWrap

  UserPool:
    Type: AWS::Cognito::UserPool
    DependsOn: PreSignUpInvokePermission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${ProjectName}-${Environment}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
      UserPoolTags:
        Project: WanderWrap

  AdminUserPoolGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: wanderwrap-admins
      Description: Least-privilege access to the WanderWrap operational console
      UserPoolId: !Ref UserPool

  PreSignUpRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-cognito-pre-signup-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: find-existing-cognito-account
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  PreSignUpFunction:
    Type: AWS::Lambda::Function
    DependsOn: PreSignUpLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-cognito-pre-signup
      Description: Blocks unverified or colliding Google identities without merging accounts
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/cognito-pre-signup.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt PreSignUpRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  PreSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-cognito-pre-signup
      RetentionInDays: 30

  PreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: !Sub ${HttpApi.ApiEndpoint}/mcp
      Name: WanderWrap API
      Scopes:
        - ScopeName: gifts.read
          ScopeDescription: Read gifting profiles, recommendations, routes and status
        - ScopeName: gifts.write
          ScopeDescription: Create and approve gifting actions

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: HasPrefixAuthDomain
    Properties:
      Domain: !If
        - HasExplicitPrefixAuthDomain
        - !Ref AuthPrefixDomainName
        - !Sub ${ProjectName}-${Environment}-${AWS::AccountId}
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 1

  CustomUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: HasCustomAuthDomain
    Properties:
      Domain: !Ref AuthDomainName
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2
      CustomDomainConfig:
        CertificateArn: !Ref AuthCertificateArn

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        authorize_scopes: openid profile email
        client_id: !Ref GoogleClientId
        client_secret: !Sub '{{resolve:secretsmanager:${GoogleClientSecretArn}:SecretString:client_secret}}'
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name
        given_name: given_name
        family_name: family_name
        picture: picture

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - ResourceServer
      - GoogleIdentityProvider
    Properties:
      ClientName: !Sub ${ProjectName}-${Environment}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - email
        - !Sub ${HttpApi.ApiEndpoint}/mcp/gifts.read
        - !Sub ${HttpApi.ApiEndpoint}/mcp/gifts.write
      CallbackURLs: !Split [',', !Ref WebCallbackUrls]
      LogoutURLs: !Split [',', !Ref WebLogoutUrls]
      SupportedIdentityProviders: !If
        - HasGoogleIdentityProvider
        - [COGNITO, Google]
        - [COGNITO]

  AlexaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasAlexaRedirect
    DependsOn: ResourceServer
    Properties:
      ClientName: !Sub ${ProjectName}-${Environment}-alexa
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        RefreshToken: days
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - !Sub ${HttpApi.ApiEndpoint}/mcp/gifts.read
        - !Sub ${HttpApi.ApiEndpoint}/mcp/gifts.write
      CallbackURLs: !Split [',', !Ref AlexaRedirectUris]
      SupportedIdentityProviders: [COGNITO]

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: wanderwrap-data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt DataTable.Arn
        - PolicyName: wanderwrap-admin-read-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !GetAtt UserPool.Arn
        - PolicyName: wanderwrap-bedrock-inference
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0
                  - arn:aws:bedrock:*:*:inference-profile/global.amazon.nova-2-lite-v1:0

  AppFunction:
    Type: AWS::Lambda::Function
    DependsOn: AppLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-app
      Description: WanderWrap web, API and MCP application
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/aws-handler.handler
      MemorySize: 512
      Timeout: 15
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          WANDERWRAP_TOKEN_CLIENT_IDS: !If
            - HasAlexaRedirect
            - !Join [',', [!Ref UserPoolClient, !Ref AlexaUserPoolClient]]
            - !Ref UserPoolClient
          WANDERWRAP_CANONICAL_URL: !If [HasCustomApiDomain, !Sub 'https://${ApiDomainName}', !GetAtt HttpApi.ApiEndpoint]
          WANDERWRAP_AUTH_ISSUER: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}
          WANDERWRAP_ALLOWED_ORIGINS: !Join [',', !Ref AllowedOrigins]
          WANDERWRAP_MCP_READ_SCOPE: !Sub ${HttpApi.ApiEndpoint}/mcp/gifts.read
          WANDERWRAP_MCP_WRITE_SCOPE: !Sub ${HttpApi.ApiEndpoint}/mcp/gifts.write
          WANDERWRAP_LEGACY_AUTH_ENABLED: 'false'
          BEDROCK_ENABLED: 'true'
          BEDROCK_REGION: eu-west-2
          BEDROCK_MODEL_ID: global.amazon.nova-2-lite-v1:0
          NODE_OPTIONS: --enable-source-maps
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-app
      RetentionInDays: 30

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-api
      ProtocolType: HTTP
      Description: WanderWrap HTTPS API
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders: [authorization, content-type, mcp-protocol-version]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        MaxAge: 300
      Tags:
        Project: WanderWrap

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AppFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Join ['/', [integrations, !Ref Integration]]

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      Tags:
        Project: WanderWrap

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  CustomApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomApiDomain
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  CustomApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomApiDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref CustomApiDomain
      Stage: !Ref DefaultStage

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-lambda-errors
      AlarmDescription: WanderWrap Lambda errors detected
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AppFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-lambda-duration
      AlarmDescription: WanderWrap Lambda p95 duration is above ten seconds
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref AppFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 10000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  AppUrl:
    Value: !If [HasCustomApiDomain, !Sub 'https://${ApiDomainName}', !GetAtt HttpApi.ApiEndpoint]
  ApiId:
    Value: !Ref HttpApi
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AlexaUserPoolClientId:
    Condition: HasAlexaRedirect
    Value: !Ref AlexaUserPoolClient
  CognitoOAuthBaseUrl:
    Value: !If
      - HasCustomAuthDomain
      - !Sub https://${AuthDomainName}
      - !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  CognitoCustomDomainDnsTarget:
    Condition: HasCustomAuthDomain
    Value: !GetAtt CustomUserPoolDomain.CloudFrontDistribution
  CognitoPrefixOAuthBaseUrl:
    Condition: HasPrefixAuthDomain
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  CognitoIssuer:
    Value: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}
  TableName:
    Value: !Ref DataTable
